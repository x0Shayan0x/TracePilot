services:
  db:
    image: postgres:16

    environment:
      POSTGRES_DB: tracepilot
      POSTGRES_USER: tracepilot
      POSTGRES_PASSWORD: tracepilot

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracepilot -d tracepilot"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    env_file:
      - .env

    ports:
      - "8000:8000"

    environment:
      DATABASE_URL: postgresql+asyncpg://tracepilot:tracepilot@db:5432/tracepilot
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6}
      
    depends_on:
      db:
        condition: service_healthy

  simulator:
    build: ./simulator

    environment:
      API_URL: http://api:8000

    depends_on:
      - api

volumes:
  postgres_data:
