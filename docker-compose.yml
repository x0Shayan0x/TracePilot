services:
  db:
    image: postgres:16

    environment:
      POSTGRES_DB: tracepilot
      POSTGRES_USER: tracepilot
      POSTGRES_PASSWORD: tracepilot

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracepilot -d tracepilot"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend

    ports:
      - "8000:8000"

    environment:
      DATABASE_URL: postgresql+asyncpg://tracepilot:tracepilot@db:5432/tracepilot

    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
