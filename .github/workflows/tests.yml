name: TracePilot tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tracepilot_test
          POSTGRES_USER: tracepilot
          POSTGRES_PASSWORD: tracepilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tracepilot -d tracepilot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+asyncpg://tracepilot:tracepilot@localhost:5432/tracepilot_test
      LLM_PROVIDER: mock
      PYTHONPATH: "${{ github.workspace }}:${{ github.workspace }}/backend"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run backend and collector tests
        run: python -m pytest -v backend/tests collector/tests
